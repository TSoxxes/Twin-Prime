name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        # Can add specific poetry versions if needed, but usually latest is fine
        # poetry-version: ['1.8.0']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      # with:
      #   version: ${{ matrix.poetry-version }} # if specific version needed
      #   virtualenvs-create: true # Recommended
      #   virtualenvs-in-project: true # Optional: creates .venv in project root

    - name: Configure Poetry
      run: poetry config virtualenvs.in-project true # Creates .venv in project root

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root --with dev --extras viz
        # --no-root: Do not install the project itself as editable, just its dependencies.
        # --with dev: Install development dependencies (pytest, black, etc.)
        # --extras viz: Install optional dependencies for visualization

    - name: Lint with Ruff
      run: |
        poetry run ruff check .
        # poetry run ruff format --check . # If using ruff for formatting check

    - name: Format with Black (check only)
      run: |
        poetry run black --check .

    - name: Sort imports with isort (check only)
      run: |
        poetry run isort --check-only .

    - name: Run tests with Pytest and generate coverage report
      run: |
        poetry run pytest --cov=pvs --cov-report=xml --cov-report=term-missing tests/
        # --cov-report=xml: for Codecov or other coverage services
        # --cov-report=term-missing: for console output of coverage

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4 # Use latest version
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Optional: if private repo or for specific features
        # files: ./coverage.xml # Optional: specify coverage file if not default
        # fail_ci_if_error: true # Optional: fail CI if Codecov upload fails
      # Note: For public repos, Codecov token is often not required.
      # For private, store CODECOV_TOKEN in GitHub secrets.

  # Optional: Job to check if documentation builds (if using Sphinx, MkDocs, etc.)
