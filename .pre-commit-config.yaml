# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # Use the latest stable version
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=1024'] # Max 1MB for files, adjust as needed
    -   id: check-merge-conflict # Check for files that contain merge conflict strings.
    -   id: check-toml # Checks TOML files for parseable syntax.
    -   id: debug-statements # Check for debugger imports and `print()` calls in python code.

-   repo: https://github.com/psf/black
    rev: 24.4.2 # Use the latest stable version compatible with Python 3.11+
    hooks:
    -   id: black
        language_version: python3.11 # Ensure this matches project's Python version

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2 # Use the latest stable version
    hooks:
    -   id: isort
        name: isort (python)
        args: ["--profile", "black"]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # rev: v0.1.6 # Replace with the latest Ruff version
    rev: v0.4.10 # Latest as of mid-2024
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix] # Auto-fix and exit if fixes were made
        # Respect pyproject.toml settings for ruff
    # -   id: ruff-format # If you want ruff to also handle formatting (alternative to black)
    #     # Ensure this doesn't conflict with black if both are used. Typically, pick one formatter.

# Optional: If you have Jupyter notebooks and want to clean them
# -   repo: https://github.com/nbQA-dev/nbQA
#     rev: 1.7.0 # Check for the latest version
#     hooks:
#     -   id: nbqa-black
#         additional_dependencies: [black==23.12.1]
#     -   id: nbqa-isort
#         additional_dependencies: [isort==5.13.2]
#     -   id: nbqa-ruff
#         additional_dependencies: [ruff==0.1.9]
#         args: [--fix, --exit-non-zero-on-fix]

# To install pre-commit hooks:
# pre-commit install
# To run on all files:
# pre-commit run --all-files
